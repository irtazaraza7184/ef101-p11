{% extends "base.html" %}
{% block title %}Edit Current Fault - {{ a.asset_id }}{% endblock %}
{% block content %}
<div class="row between" style="margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:12px">
  <div class="row" style="gap:10px">
    <a class="btn sec" href="{{ url_for('asset_detail', asset_id=a.asset_id) }}" style="padding:6px 10px" title="Back to asset">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </a>
    <div>
      <h1>Edit Current Open Fault &middot; {{ a.asset_id }}</h1>
      <div class="subtitle">Update the current defect description, actions, technician assignment, or updated cost.</div>
    </div>
  </div>
</div>

<div class="card" style="max-width:840px;margin:0 auto">
  <form method="post" novalidate>
    <div class="formgrid">
      <div>
        <label for="f-status_date">Fault Date * (YYYY-MM-DD)</label>
        <input type="date" name="status_date" value="{{ a.get('status_date', '') }}" id="f-status_date">
      </div>
      <div>
        <label for="f-status_category">Fault category</label>
        <select name="status_category" id="f-status_category">
          {% for o in fault_categories %}<option{{ ' selected' if (a.get('status_category') or 'Unknown')==o }}>{{ o }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label for="f-status_detail">Fault description</label>
        <input name="status_detail" value="{{ a.get('status_detail', '') or '' }}" placeholder="What is wrong?" id="f-status_detail">
      </div>
      <div>
        <label for="f-status_action">Actions to be taken</label>
        <input name="status_action" value="{{ a.get('status_action', '') or '' }}" placeholder="Planned fix, or what was just done" id="f-status_action">
      </div>
      <div>
        <label for="f-status_technician">Technician {{ '*' if a.status == 'Under Repair' else '' }}</label>
        <input name="status_technician" value="{{ a.get('status_technician', '') or '' }}" placeholder="{{ 'Required when Under Repair' if a.status == 'Under Repair' else 'Technician name' }}" id="f-status_technician">
      </div>
      <div>
        <label for="f-cost">Updated Cost ($)</label>
        <input type="number" step="any" min="0" name="cost" class="font-mono" value="{{ a.get('cost') or a.get('status_cost') or 0 }}" placeholder="0" id="f-cost">
      </div>
    </div>
    <div class="row" style="margin-top:20px;gap:10px">
      <button class="btn" type="submit">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
        Save Changes
      </button>
      <a class="btn sec" href="{{ url_for('asset_detail', asset_id=a.asset_id) }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
