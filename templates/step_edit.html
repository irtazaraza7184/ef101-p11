{% extends "base.html" %}
{% block title %}Edit Step #{{ s.id }}{% endblock %}
{% block content %}
<div class="row between" style="margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:12px">
  <div class="row" style="gap:10px">
    <a class="btn sec" href="{{ url_for('asset_detail', asset_id=s.asset_id) }}" style="padding:6px 10px" title="Back to asset">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </a>
    <div>
      <h1>Edit Fault Step #{{ s.id }} &middot; {{ s.asset_id }}</h1>
      <div class="subtitle">Update the interim diagnostic action or assigned technician.</div>
    </div>
  </div>
</div>

<div class="card" style="max-width:840px;margin:0 auto">
  <form method="post" novalidate>
    <div class="formgrid">
      <div>
        <label for="f-step_date">Step Date * (YYYY-MM-DD)</label>
        <input type="date" name="step_date" value="{{ s.get('step_date', '') }}" id="f-step_date">
      </div>
      <div>
        <label for="f-action">Action taken</label>
        <input name="action" value="{{ s.get('action', '') }}" placeholder="Action description" id="f-action">
      </div>
      <div>
        <label for="f-technician">Technician</label>
        <input name="technician" value="{{ s.get('technician', '') }}" placeholder="Technician name" id="f-technician">
      </div>
    </div>
    <div class="row" style="margin-top:20px;gap:10px">
      <button class="btn" type="submit">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
        Save Changes
      </button>
      <a class="btn sec" href="{{ url_for('asset_detail', asset_id=s.asset_id) }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
