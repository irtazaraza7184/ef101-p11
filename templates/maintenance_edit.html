{% extends "base.html" %}
{% block title %}Edit Maintenance Event #{{ event_id }}{% endblock %}
{% block content %}
<div class="row between" style="margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:12px">
  <div class="row" style="gap:10px">
    <a class="btn sec" href="{{ url_for('asset_detail', asset_id=asset.asset_id) }}" style="padding:6px 10px" title="Back to asset">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </a>
    <div>
      <h1>Edit Maintenance Event #{{ event_id }} &middot; {{ asset.asset_id }}</h1>
      <div class="subtitle">Modify completed repair details, parts replaced, technician, or cost.</div>
    </div>
  </div>
</div>

<div class="card" style="max-width:840px;margin:0 auto">
  <form method="post" novalidate>
    <div class="formgrid">
      <div>
        <label for="f-event_date">Event Date * (YYYY-MM-DD)</label>
        <input type="date" name="event_date" value="{{ ev.get('event_date', '') }}" id="f-event_date">
      </div>
      <div>
        <label for="f-fault_category">Fault category *</label>
        <select name="fault_category" id="f-fault_category">
          <option value="">— choose —</option>
          {% for o in fault_categories %}<option{{ ' selected' if ev.get('fault_category')==o }}>{{ o }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label for="f-fault_description">Fault description *</label>
        <input name="fault_description" value="{{ ev.get('fault_description', '') }}" placeholder="What went wrong?" id="f-fault_description">
      </div>
      <div>
        <label for="f-action_taken">Action taken *</label>
        <input name="action_taken" value="{{ ev.get('action_taken', '') }}" placeholder="What was done?" id="f-action_taken">
      </div>
      <div>
        <label for="f-technician">Technician *</label>
        <input name="technician" value="{{ ev.get('technician', '') }}" placeholder="Technician name" id="f-technician">
      </div>
      <div>
        <label for="f-cost">Updated Cost ($)</label>
        <input type="number" step="any" min="0" name="cost" class="font-mono" value="{{ ev.get('cost') or ev.get('cost_usd') or 0 }}" placeholder="0" id="f-cost">
      </div>
    </div>
    <div class="row" style="margin-top:20px;gap:10px">
      <button class="btn" type="submit">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
        Save Changes
      </button>
      <a class="btn sec" href="{{ url_for('asset_detail', asset_id=asset.asset_id) }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
